<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Appointment Booking</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <h1>Book an Appointment</h1>
      </header>

      <form class="booking" id="booking-form">
        <section class="calendar">
          <label for="date">Select a date</label>
          <input type="date" id="date" />
          <h2 id="timeslots-heading">Available Time Slots</h2>
          <fieldset class="timeslots" aria-labelledby="timeslots-heading">
            <legend class="hidden">Choose a time slot</legend>
            <label class="slot"
              ><input
                type="radio"
                aria-label="Select 09:00 time slot"
                name="time"
              />09:00</label
            >

            <label class="slot"
              ><input
                type="radio"
                aria-label="Select 10:30 time slot"
                name="time"
              />10:30</label
            >

            <label class="slot"
              ><input
                type="radio"
                aria-label="Select 13:00 time slot"
                name="time"
              />13:00</label
            >

            <label class="slot"
              ><input
                type="radio"
                aria-label="Select 14:30 time slot"
                name="time"
              />14:30</label
            >

            <label class="slot"
              ><input
                type="radio"
                aria-label="Select 16:00 time slot"
                name="time"
              />16:00</label
            >
          </fieldset>
          <div class="info-container">
            <h2>Personal Information</h2>
            <label for="name">Full Name</label>
            <input
              class="personal-info"
              type="name"
              id="name"
              name="name"
              required
              placeholder="John McDoe"
            />
            <label for="email">E-mail Address</label>
            <input
              class="personal-info"
              type="email"
              id="email"
              name="email"
              required
              placeholder="johnmcdoe@xyz.com"
            />
            <label for="phone">Mobile Phone</label>
            <input
              class="personal-info"
              type="tel"
              id="phone"
              name="phone"
              required
              placeholder="123456789"
            />
          </div>
        </section>

        <aside class="summary">
          <h2>Your Appointment</h2>
          <p>Date: <span id="selected-date">-</span></p>
          <p>Time: <span id="selected-time">-</span></p>
          <p>Name <span id="selected-name">-</span></p>
          <p>Email <span id="selected-email">-</span></p>
          <p>Phone <span id="selected-phone">-</span></p>
          <button id="confirm" disabled>Confirm Booking</button>
        </aside>
      </form>

      <div class="hidden" id="confirmation-msg">
        <h2>Your booking is confirmed!</h2>
      </div>
      <div class="hidden" id="error-msg">
        <h2>An error occured! Please try again.</h2>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
