<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Posts</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">Lesson 21</p>
      <h1>Posts</h1>
      <p class="lede">
        A list of posts loaded from JSONPlaceholder and rendered in the page.
      </p>
    </header>

    <main>
      <section aria-labelledby="posts-heading">
        <h2 id="posts-heading" class="visually-hidden">All posts</h2>
        <p id="status" class="status" role="status" aria-live="polite">
          Loading posts…
        </p>
        <div id="posts" class="posts"></div>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
