<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Users</title>
    <link rel="stylesheet" type="text/css" href="styles.css" />
  </head>
  <body>
    <nav aria-label="Main">
      <button id="fetchUsersButton" type="button" class="button">
        Fetch Users
      </button>
      <a href="./pages/create.html" id="createUserButton" class="button"
        >Create User</a
      >
    </nav>
    <!--
      Fetch all users and display them on the page.
      For every user, add a button to update the user and delete the user.
      When the update button is clicked, redirect user to the update user page with a form to update the user. (Separate page)
      When the delete button is clicked, send request to delete the user.
      Add a button to create a new user. When the button is clicked, redirect user to the create user page with a form to create a new user. (Separate page)

    -->
    <main>
      <h1>Users</h1>
      <p class="status" id="statusMessage" role="status"></p>
      <ul class="container" id="container" aria-label="User list"></ul>
    </main>

    <script src="./utils.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
