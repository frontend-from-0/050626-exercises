<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form Validation</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main>
      <h1>Checkout</h1>
      <form novalidate id="checkoutForm" method="GET">
        <div class="input-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="email@example.com"
            name="email"
            autocomplete="email"
            aria-describedby="emailError"
          />
          <p id="emailError" class="input-error hidden" role="alert">
            Please provide a valid email address.
          </p>
        </div>
        <div class="input-group">
          <label for="phone">Phone</label>
          <input
            id="phone"
            type="tel"
            placeholder="555 123 4567"
            name="phoneNumber"
            autocomplete="tel"
            aria-describedby="phoneError"
          />
          <p id="phoneError" class="input-error hidden" role="alert">
            Please provide a valid phone number.
          </p>
        </div>
        <div class="input-group">
          <label for="firstname">First Name</label>
          <input
            id="firstname"
            type="text"
            placeholder="Sophia"
            name="firstname"
            autocomplete="given-name"
            aria-describedby="firstNameError"
          />
          <p id="firstNameError" class="input-error hidden" role="alert"></p>
        </div>
        <div class="input-group">
          <label for="lastname">Last Name</label>
          <input
            id="lastname"
            type="text"
            placeholder="Clark"
            name="lastname"
            autocomplete="family-name"
            aria-describedby="lastNameError"
          />
          <p id="lastNameError" class="input-error hidden" role="alert"></p>
        </div>

        <div class="input-group">
          <label for="cardnumber">Card Number</label>
          <input
            id="cardnumber"
            type="text"
            inputmode="numeric"
            placeholder="1234 5678 9101 1121"
            name="cardnumber"
            autocomplete="cc-number"
            aria-describedby="cardNumberError"
          />
          <p id="cardNumberError" class="input-error hidden" role="alert">
            Card number must be 16 digits.
          </p>
        </div>
        <div class="input-group">
          <label for="expDate">Expiration Date</label>
          <input
            id="expDate"
            type="text"
            placeholder="MM/YY"
            name="expDate"
            autocomplete="cc-exp"
            aria-describedby="expDateError"
          />
          <p id="expDateError" class="input-error hidden" role="alert">
            Enter a valid date in MM/YY format.
          </p>
        </div>
        <div class="input-group">
          <label for="cvv">CVV</label>
          <input
            id="cvv"
            type="text"
            inputmode="numeric"
            placeholder="123"
            name="cvv"
            autocomplete="cc-csc"
            aria-describedby="cvvError"
          />
          <p id="cvvError" class="input-error hidden" role="alert">
            CVV must be 3 or 4 digits.
          </p>
        </div>
        <button type="submit" class="btn-success">Place Order</button>
      </form>
      <div class="hidden" id="success" role="status">
        <h2>Thank you for your order!</h2>
        <p>
          Your payment was received successfully. A confirmation email will be
          sent to <span id="successEmail"></span>.
        </p>
      </div>
    </main>
    <script src="./script.js"></script>
  </body>
</html>
